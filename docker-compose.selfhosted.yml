# ============================================
# Docker Compose - SELF-HOSTED VERSION
# ============================================
# Menggunakan PostgreSQL lokal + Express backend
#
# Arsitektur:
#   Nginx (80/443) → Frontend (3000) → Backend (5000) → PostgreSQL (5432)
#
# Usage:
#   cp .env.selfhosted.example .env
#   docker-compose -f docker-compose.selfhosted.yml up -d --build
#

services:
  # ========== DATABASE ==========
  postgres:
    image: postgres:16-alpine
    container_name: flower_db
    environment:
      POSTGRES_USER: ${DB_USER:-flower_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flower_secret}
      POSTGRES_DB: ${DB_NAME:-flower_marketplace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-flower_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== BACKEND API ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flower_backend
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${DB_USER:-flower_user}:${DB_PASSWORD:-flower_secret}@postgres:5432/${DB_NAME:-flower_marketplace}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========== FRONTEND ==========
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://backend:5000
        - NEXT_PUBLIC_USE_SUPABASE=false
    container_name: flower_frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ========== NGINX REVERSE PROXY ==========
  nginx:
    image: nginx:alpine
    container_name: flower_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
